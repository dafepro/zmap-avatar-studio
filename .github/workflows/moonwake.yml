name: Moonwake Festival set evidence
on:
  push:
    branches: ["codex/asset-set-moonwake"]
  pull_request:
    paths:
      - "public/capsule/parts/*moonwake*.json"
      - "public/capsule/models/*moonwake*.glb"
      - "public/capsule/sets/moonwake-festival.json"
      - "public/capsule/looks/moonwake-festival.shift.json"
      - "tests/moonwake-set.test.ts"
      - "tests/browser/moonwake-set.spec.ts"
      - "tests/fixtures/moonwake-review.ts"
      - "playwright.moonwake.config.ts"
      - ".github/workflows/moonwake.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  moonwake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-capsule-catalog.mjs
      - run: node --import tsx --test tests/moonwake-set.test.ts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.moonwake.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moonwake-actual-browser-evidence
          path: |
            docs/evidence/moonwake/browser-*
            test-results/
          retention-days: 30
