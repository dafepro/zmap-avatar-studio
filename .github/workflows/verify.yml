name: Verify
on: [push, pull_request]
# PR and push events for the same branch share a group. A newer head
# supersedes only its own workflow/branch; all test assertions still run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package
        env:
          ZMAP_BROWSER_CHANNEL: chromium
      - run: npm run test:e2e
        env:
          ZMAP_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-visual-evidence
          path: |
            docs/evidence/
            test-results/
