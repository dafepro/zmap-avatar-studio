name: Kiln Workshop set evidence
on:
  push:
    branches: ["codex/asset-set-kiln"]
  pull_request:
    paths:
      - "public/capsule/parts/*kiln*.json"
      - "public/capsule/models/*kiln*.glb"
      - "public/capsule/sets/kiln-workshop.json"
      - "public/capsule/looks/kiln-workshop.shift.json"
      - "tests/kiln-workshop.test.ts"
      - "tests/browser/kiln-workshop.spec.ts"
      - "tests/fixtures/kiln-review.ts"
      - "playwright.kiln.config.ts"
      - ".github/workflows/kiln.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  kiln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-capsule-catalog.mjs
      - run: node --import tsx --test tests/kiln-workshop.test.ts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.kiln.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-workshop-actual-browser-evidence
          path: |
            docs/evidence/kiln/browser-*
            docs/evidence/kiln/body-clearance.json
            test-results/
          retention-days: 30
